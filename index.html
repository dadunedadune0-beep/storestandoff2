<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport"content="width=device-width, initial-scale=1.0"> <title>Магазин Standoff 2</title> <style> body { background-color: #161821; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; } /* Верхняя панель (Навигация) */ .nav-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2f3545; padding: 15px 30px; background: #1a1d26; } .nav-left { display: flex; gap: 30px; align-items: center; } .tab { color: #888; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 16px; } .tab.active { color: #ffaa00; border-bottom: 2px solid #ffaa00; padding-bottom: 5px; } .badge { background: #ff4444; color: #fff; border-radius: 50%; padding: 2px 7px; font-size: 12px; vertical-align: super; margin-left: 5px; } .icons-group { display: flex; gap: 15px; color: #aaa; font-size: 20px; align-items: center; margin-left: 10px; } /* Профиль справа */ .nav-right { display: flex; align-items: center; } .profile-box { background: #1f232e; padding: 8px 15px; border-radius: 8px; display: flex; align-items: center; gap: 12px; border: 1px solid #2f3545; } .avatar { width: 35px; height: 35px; background: #3a3f50; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; } .profile-info strong { display: block; font-size: 14px; color: #fff; } .profile-info span { color: #ffaa00; font-size: 12px; display: block; } /* Основной блок */ .main-container { padding: 30px; max-width: 1200px; margin: 0 auto; } /* Сетка карточек голды */ .items-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; margin-top: 20px; } .item-card { background: #1f232e; padding: 30px 25px; border-radius: 15px; border: 1px solid #2f3545; text-align: center; position: relative; } .discount { position: absolute; top: 15px; left: 15px; background: #ff4444; color: #fff; padding: 5px 10px; border-radius: 5px; font-size: 14px; font-weight: bold; } .gold-icon { font-size: 65px; margin: 25px 0; display: block; } .item-card h3 { margin: 0 0 15px 0; font-size: 26px; font-weight: bold; letter-spacing: 0.5px; } /* Кнопка с ценой */ .price-btn { width: 100%; background: #ffaa00; color: #161821; font-size: 18px; padding: 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; } .price-btn:hover { background: #e69500; } </style> </head> <body> <!-- НАВИГАЦИЯ --> <div class="nav-bar"> <divclass="nav-left"> <div class="tab">BATTLE SHOP</div> <div class="tab">АКЦИИ <spanclass="badge">3</span></div> <div class="tab active">GOLD</div> <div class="icons-group">🎁 🛒 3</div> </div> <div class="nav-right"> <div class="profile-box"> <div class="avatar">👤</div> <div class="profile-info"> <strong>HAVAL M6</strong> <span>ID: 98062435</span> </div> </div> </div> </div> <!-- ОСНОВНАЯ ВИТРИНА --> <div class="main-container"> <divclass="items-grid"> <!-- 500 голды --> <div class="item-card"> <span class="discount">-15%</span> <span class="gold-icon">🪙</span> <h3>G 500</h3> <button class="price-btn">499₽</button> </div> <!-- 1000 голды --> <div class="item-card"> <span class="discount">-25%</span> <span class="gold-icon">🪙</span> <h3>G 1000</h3> <button class="price-btn">899₽</button> </div> <!-- 3000 голды --> <div class="item-card"> <span class="discount">-45%</span> <span class="gold-icon">🪙</span> <h3>G 3000</h3> <button class="price-btn">1990₽</button> </div> </div> </div> </body> </html>
