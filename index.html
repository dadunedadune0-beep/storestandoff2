
<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport"content="width=device-width, initial-scale=1.0"> <title>Магазин Standoff 2</title> <style> body { background-color: #161821; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; } .nav-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2f3545; padding-bottom: 15px; margin-bottom: 20px; } .nav-tabs { display: flex; gap: 20px; } .tab { color: #888; font-weight: bold; cursor: pointer; } .tab.active { color: #ffaa00; border-bottom: 2px solid #ffaa00; } .cart-btn { background: #ffaa00; color: #161821; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; } .banner { background: #1a1d26 url('https://imgur.com') center/cover; height: 250px; border-radius: 15px; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; border: 1px solid #2f3545; } .items-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; } .item-card { background: #ffaa00; padding: 20px; border-radius: 15px; text-align: center; color: #161821; position: relative; } .gold-icon { font-size: 50px; margin: 10px 0; display: block; } .price-btn { width: 100%; background: #161821; color: #ffaa00; font-size: 16px; margin-top: 15px; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; } .price-btn:hover { background: #3a3f50; } .item-card h3 { margin: 0; } </style> </head> <body> <divclass="nav-bar"> <div class="nav-tabs"> <div class="tab">BATTLE SHOP</div> <divclass="tab">АКЦИИ</div> <div class="tab active">GOLD</div> </div> <button class="cart-btn"onclick="goToCart()">Корзина</button> </div> <div class="banner"> <!-- Баннер персонажа --></div> <div class="items-grid"> <div class="item-card"> <h3>G 100</h3> <span class="gold-icon">🪙</span> <button class="price-btn" onclick="addToCart('G 100', 119)">119 ₽</button> </div> <div class="item-card"> <h3>G 500</h3> <span class="gold-icon">🪙</span> <buttonclass="price-btn" onclick="addToCart('G 500', 499)">499 ₽</button> </div> <div class="item-card"> <h3>G 1000</h3> <span class="gold-icon">🪙</span> <button class="price-btn"onclick="addToCart('G 1000', 899)">899 ₽</button> </div> <div class="item-card"> <h3>G 3000</h3> <span class="gold-icon">🪙</span> <button class="price-btn" onclick="addToCart('G 3000', 1990)">1990 ₽</button> </div> </div> <script> function addToCart(item, price) { alert(item + " добавлено в корзину!"); } function goToCart() { alert("Переход в корзину!"); } </script> </body> </html>
