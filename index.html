<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин Standoff 2</title>
    <style>
        body { background-color: #161821; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .box { max-width: 450px; margin: 40px auto; background: #1f232e; padding: 30px; border-radius: 15px; border: 1px solid #2f3545; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { padding: 12px; width: 85%; margin-bottom: 20px; border-radius: 8px; border: none; background: #161821; color: #fff; text-align: center; font-size: 16px; }
        button { padding: 14px 25px; background: #ffaa00; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: #161821; font-size: 16px; width: 90%; transition: 0.3s; }
        button:hover { background: #e69500; }

        /* Профиль игрока при авторизации */
        #player-card { display: none; background: #161821; padding: 20px; border-radius: 10px; margin-top: 20px; border: 1px solid #ffaa00; text-align: left; display: flex; align-items: center; gap: 15px; }
        .avatar { width: 60px; height: 60px; background: #3a3f50; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        .player-details strong { display: block; font-size: 18px; color: #fff; }
        .player-details span { color: #ffaa00; font-size: 14px; }

        /* Основные экраны */
        #shop-content, #cart-content, #checkout-content, #success-content { display: none; max-width: 900px; margin: 20px auto; background: #1f232e; padding: 20px; border-radius: 15px; border: 1px solid #2f3545; text-align: left; }

        /* Навбар */
        .shop-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2f3545; padding-bottom: 15px; margin-bottom: 20px; }
        .cart-btn { background: #ffaa00; color: #161821; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; width: auto; }

        /* Сетка товаров */
        .items-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .item-card { background: #1a1d26; padding: 25px; border-radius: 15px; border: 1px solid #2f3545; text-align: center; }
        .gold-icon { font-size: 50px; margin: 15px 0; display: block; }
        .price-btn { width: 100%; background: #3a3f50; color: #fff; font-size: 16px; margin-top: 10px; }
        .price-btn:hover { background: #ffaa00; color: #161821; }

        /* Элементы корзины */
        .cart-item { background: #1a1d26; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2f3545; }

        /* Выбор оплаты */
        .payment-methods { display: flex; gap: 15px; margin: 20px 0; }
        .payment-card { flex: 1; background: #1a1d26; padding: 20px; border-radius: 10px; border: 2px solid #2f3545; cursor: pointer; text-align: center; font-weight: bold; font-size: 18px; }
        .payment-card.active { border-color: #ffaa00; color: #ffaa00; }

        /* Успешный экран */
        .success-box { text-align: center; padding: 40px 20px; }
        .success-icon { font-size: 60px; color: #00ff66; display: block; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: АВТОРbranchИЗАЦИЯ -->
    <div class="box" id="login-box">
        <h1>Авторизация</h1>
        <p>Введите ID игрока:</p>
        <input type="number" id="player-id" placeholder="Например: 86688776">
        <br>
        <button onclick="findPlayer()">Найти</button>
<div id="player-card">
            <div class="avatar">👤</div>
            <div class="player-details">
                <strong id="player-name">Игрок</strong>
                <span>ID: <span id="player-num"></span></span>
            </div>
        </div>
        <br>
        <button id="start-btn" style="display:none; margin-top: 10px;" onclick="startShopping()">Начать покупки</button>
    </div>

    <!-- ЭКРАН 2: САМ МАГАЗИН -->
    <div id="shop-content">
        <div class="shop-header">
            <h2>Магазин Gold</h2>
            <button class="cart-btn" onclick="goToCart()">Корзина (<span id="cart-count">0</span>)</button>
        </div>

        <div class="items-grid">
            <div class="item-card">
                <span class="gold-icon">🪙</span>
                <h3>G 500</h3>
                <button class="price-btn" onclick="addToCart('G 500', 499)">499 ₽</button>
            </div>
            <div class="item-card">
                <span class="gold-icon">🪙</span>
                <h3>G 1000</h3>
                <button class="price-btn" onclick="addToCart('G 1000', 899)">899 ₽</button>
            </div>
            <div class="item-card">
                <span class="gold-icon">🪙</span>
                <h3>G 3000</h3>
                <button class="price-btn" onclick="addToCart('G 3000', 1990)">1990 ₽</button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 3: КОРЗИНА -->
    <div id="cart-content">
        <h2>Ваша корзина</h2>
        <div id="cart-items"></div>
        <div style="margin-top: 20px; text-align: right;">
            <h3>Итого: <span id="cart-total">0</span> ₽</h3>
            <button style="width: auto; padding: 12px 40px;" onclick="goToCheckout()">Купить для себя</button>
        </div>
    </div>

    <!-- ЭКРАН 4: ОФОРМЛЕНИЕ И СБП -->
    <div id="checkout-content">
        <h2>Оформление заказа</h2>
        <p>Способ оплаты:</p>
        <div class="payment-methods">
            <div class="payment-card active">Система Быстрых Платежей (СБП)</div>
        </div>
        <div style="text-align: center; margin-top: 30px;">
            <p style="font-size: 18px;">К оплате: <strong id="checkout-total" style="color: #ffaa00;">0</strong> ₽</p>
            <button style="max-width: 300px;" onclick="pay()">Оплатить через СБП</button>
        </div>
    </div>

    <!-- ЭКРАН 5: ОПЛАТА ПРОШЛА (УСПЕШНО) -->
    <div id="success-content" class="box" style="margin-top: 40px;">
        <div class="success-box">
            <span class="success-icon">✔</span>
            <h2>Оплата успешно выполнена!</h2>
            <p>Золото зачислено на аккаунт <strong id="success-player" style="color: #ffaa00;"></strong>.</p>
            <br>
            <button onclick="restart()">Вернуться на главную</button>
        </div>
    </div>

    <script>
        let cart = [];
        let total = 0;
        let globalId = "";

        function findPlayer() {
            let id = document.getElementById('player-id').value;
            if(id.length > 5) {
                globalId = id;
                document.getElementById('player-num').innerText = id;
                document.getElementById('player-name').innerText = "HAVAL M6"; 
                document.getElementById('player-card').style.display = 'flex';
                document.getElementById('start-btn').style.display = 'inline-block';
            } else {
                alert("Введите корректный ID (больше 5 цифр)");
            }
        }

        function startShopping() {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('shop-content').style.display = 'block';
        }
function addToCart(item, price) {
            cart.push({item, price});
            total += price;
            document.getElementById('cart-count').innerText = cart.length;
            alert(item + " добавлено в корзину!");
        }

        function goToCart() {
            if (cart.length === 0) {
                alert("Ваша корзина пуста!");
                return;
            }
            document.getElementById('shop-content').style.display = 'none';
            let cartItemsDiv = document.getElementById('cart-items');
            cartItemsDiv.innerHTML = '';

            cart.forEach(cartItem => {
                cartItemsDiv.innerHTML +=                     <div class="cart-item">                        <span>${cartItem.item}</span>                        <strong>${cartItem.price} ₽</strong>                    </div>;
            });

            document.getElementById('cart-total').innerText = total;
            document.getElementById('cart-content').style.display = 'block';
        }

        function goToCheckout() {
            document.getElementById('cart-content').style.display = 'none';
            document.getElementById('checkout-total').innerText = total;
            document.getElementById('checkout-content').style.display = 'block';
        }

        function pay() {
            document.getElementById('checkout-content').style.display = 'none';
            document.getElementById('success-player').innerText = "ID " + globalId;
            document.getElementById('success-content').style.display = 'block';
        }

        function restart() {
            cart = [];
            total = 0;
            document.getElementById('cart-count').innerText = 0;
            document.getElementById('player-id').value = '';
            document.getElementById('player-card').style.display = 'none';
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('success-content').style.display = 'none';
            document.getElementById('login-box').style.display = 'block';
        }
    </script>

</body>
</html>
