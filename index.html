<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standoff 2 Shop 
    <style>
        /* Здесь позже будут красивые стили оформления */
        body { background-color: #0f1115; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .shop-box { max-width: 600px; margin: 0 auto; background: #161920; padding: 20px; border-radius: 10px; border: 1px solid #2a2f3a; }
        input { padding: 10px; width: 80%; margin-bottom: 20px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #ffaa00; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="shop-box">
        <h1>Магазин Standoff 2 

        <!-- Блок ввода ID -->
        <p>Введите ID игрока для проверки:</p>
        <input type="number" id="player-id" placeholder="Например: 12345678">
        <br>
        <button onclick="checkPlayer()">Проверить ID</button>

        <p id="status-text" style="color: #ffaa00; margin-top: 15px;"></p>
    </div>

    <script>
        // Здесь позже будет логика покупок и поиска игрока
        function checkPlayer() {
            let id = document.getElementById('player-id').value;
            if(id.length > 5) {
                document.getElementById('status-text').innerText = "Игрок " + id + " успешно найден!";
            } else {
                document.getElementById('status-text').innerText = "Введите корректный ID (более 5 цифр)";
            }
        }
    </script>

</body>
</html>
